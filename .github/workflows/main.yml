name: Zibbo Watcher

on:
  schedule:
    # Repo privado: cambia a "*/30 * * * *" para no pasarte de los 2.000 min/mes.
    - cron: "*/10 * * * *"
  # Botón "Run workflow" y disparador externo (cron-job.org)
  workflow_dispatch:

permissions:
  contents: write # solo para el commit de keepalive

# Nunca dos ejecuciones a la vez: la segunda espera a que termine la primera
concurrency:
  group: zibbo-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El estado (qué se ha anunciado ya) vive en la caché de Actions, no en el repo
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: .zibbo-state
          key: zibbo-state-${{ github.run_id }}
          restore-keys: zibbo-state-

      - name: Comprobar Twitch / YouTube
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_GAME_ID: ${{ vars.TWITCH_GAME_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Twitch se mira en cada ejecución; YouTube como mucho cada 30 min (48 búsquedas/día)
          YOUTUBE_INTERVAL_SECONDS: "1800"
          STATE_FILE: .zibbo-state/state.json
        run: python zibbo_watcher.py --once

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zibbo-state
          key: zibbo-state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub desactiva los cron de repos públicos tras 60 días sin commits
      - name: Keepalive
        if: always()
        continue-on-error: true
        run: |
          [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 4320000 ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
